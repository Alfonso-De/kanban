kanban_board:
  name: "Project Kanban Board"
  description: "A Kanban board template with standard workflow columns"
  
  columns:
    - id: "todo"
      name: "To do"
      description: "Tasks that need to be started"
      order: 1
      color: "#e3f2fd"
      limit: null
      cards:
        - id: "card-1"
          title: "Define project requirements"
          description: "Gather and document all project requirements from stakeholders"
          priority: "high"
          assignee: null
          labels: ["planning", "requirements"]
          created_date: "2024-01-01"
          due_date: null
          
        - id: "card-2"
          title: "Set up development environment"
          description: "Configure development tools and environment"
          priority: "medium"
          assignee: null
          labels: ["setup", "development"]
          created_date: "2024-01-01"
          due_date: null
    
    - id: "in_progress"
      name: "In progress"
      description: "Tasks currently being worked on"
      order: 2
      color: "#fff3e0"
      limit: 3
      cards:
        - id: "card-3"
          title: "Design database schema"
          description: "Create the database structure for the application"
          priority: "high"
          assignee: "developer1"
          labels: ["database", "design"]
          created_date: "2024-01-02"
          due_date: "2024-01-15"
    
    - id: "to_test"
      name: "To Test"
      description: "Tasks completed and ready for testing"
      order: 3
      color: "#f3e5f5"
      limit: 5
      cards:
        - id: "card-4"
          title: "User authentication module"
          description: "Login and registration functionality implementation"
          priority: "high"
          assignee: "tester1"
          labels: ["authentication", "security"]
          created_date: "2024-01-03"
          due_date: "2024-01-10"
    
    - id: "done"
      name: "Done"
      description: "Completed and tested tasks"
      order: 4
      color: "#e8f5e8"
      limit: null
      cards:
        - id: "card-5"
          title: "Project initialization"
          description: "Initial project setup and repository creation"
          priority: "medium"
          assignee: "developer1"
          labels: ["setup", "initialization"]
          created_date: "2024-01-01"
          due_date: null
          completed_date: "2024-01-01"

  metadata:
    created_date: "2024-01-01"
    last_modified: "2024-01-01"
    version: "1.0"
    template_type: "standard_workflow"